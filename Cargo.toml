[package]
name = "vega-crack"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
ocl = "0.19"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true